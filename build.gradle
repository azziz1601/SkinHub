plugins {
    id 'java'
    // Menggunakan fork Shadow yang kompatibel dengan Java 21+
    id "io.github.goooler.shadow" version "8.1.8"
}

group = 'zeroends'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT"
    implementation "com.sparkjava:spark-core:2.9.4"
    implementation "org.slf4j:slf4j-simple:2.0.9"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.16.0"
    implementation "org.xerial:sqlite-jdbc:3.44.1.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    
    // SOLUSI: Exclude file signature yang menyebabkan konflik di Uber-JAR
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE'
    
    // Menggabungkan file services (penting untuk JDBC dan Spark)
    mergeServiceFiles()

    // Relokasi library agar tidak konflik dengan plugin lain
    relocate 'spark', 'zeroends.skinhub.libs.spark'
    relocate 'javax.servlet', 'zeroends.skinhub.libs.javax.servlet'
    relocate 'org.eclipse.jetty', 'zeroends.skinhub.libs.jetty'
    relocate 'org.slf4j', 'zeroends.skinhub.libs.slf4j'
    relocate 'com.fasterxml.jackson', 'zeroends.skinhub.libs.jackson'
    relocate 'org.sqlite', 'zeroends.skinhub.libs.sqlite'
}

tasks.build.dependsOn shadowJar